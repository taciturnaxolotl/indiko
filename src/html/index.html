<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dashboard • indiko</title>
  <meta name="description" content="Your Indiko dashboard - manage your profile, apps, and passkeys" />
  <link rel="icon" href="../../public/favicon.svg" type="image/svg+xml" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Dashboard • Indiko" />
  <meta property="og:description" content="Your Indiko dashboard - manage your profile, apps, and passkeys" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Dashboard • Indiko" />
  <meta name="twitter:description" content="Your Indiko dashboard - manage your profile, apps, and passkeys" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../client/ds/tokens.css">
  <link rel="stylesheet" href="../client/ds/components.css">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body {
      align-items: stretch;
    }

    header {
      width: 100%;
      max-width: var(--page-width);
      margin: 0 auto 3rem;
    }

    main {
      width: 100%;
      max-width: var(--page-width);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    h1 {
      font-size: var(--text-2xl);
      margin-bottom: var(--space-1);
    }

    .subtitle {
      color: var(--paper-dim);
      font-size: var(--text-md);
      font-weight: 300;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border: 3px solid var(--accent);
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--paper);
      overflow: hidden;
    }

    .avatar-upload {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .avatar-controls {
      flex: 1;
    }

    label {
      display: block;
      margin-top: 1rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="url"] {
      margin-bottom: 0.25rem;
    }

    .apps-preview {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .app-item {
      padding: 0.75rem;
      background: var(--ink-sunken);
      border: 1px solid var(--accent-deep);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-name {
      font-weight: 500;
      color: var(--paper);
    }

    .app-date {
      font-size: var(--text-sm);
      color: var(--paper-dim);
    }

    .empty {
      color: var(--paper-dim);
      font-size: var(--text-sm);
      padding: 0.75rem 0;
    }

    .view-all {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: var(--accent);
      text-decoration: none;
      font-size: var(--text-sm);
    }

    .view-all:hover {
      text-decoration: underline;
    }

    #passkeysList {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    i-button {
      display: block;
      margin-top: 1rem;
    }

    footer {
      width: 100%;
      max-width: var(--page-width);
      margin: 2rem auto 0;
      text-align: center;
      color: var(--paper-dim);
      font-size: var(--text-sm);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    #dangerZone i-card {
      border-color: var(--accent-deep);
    }
  </style>
</head>

<body>
  <i-nav active="dashboard"></i-nav>

  <header>
    <h1 id="welcome">welcome</h1>
    <p class="subtitle" id="subtitle">loading...</p>
  </header>

  <main>
    <i-card>
      <h2 class="card-title">recent apps</h2>
      <div id="recentApps" class="apps-preview">
        <div class="empty">loading...</div>
      </div>
    </i-card>

    <i-card>
      <h2 class="card-title">passkeys</h2>
      <p style="color: var(--paper-dim); margin-bottom: 1rem; line-height: 1.6; font-size: var(--text-sm);">
        Manage your passkeys for secure, password-free authentication.
      </p>
      <div id="passkeysList">
        <div class="empty">loading...</div>
      </div>
      <i-button id="addPasskeyBtn"><button type="button">add new passkey</button></i-button>
    </i-card>

    <i-card>
      <h2 class="card-title">profile settings</h2>
      <form id="profileForm">
        <div class="avatar-upload">
          <div class="profile-avatar" id="avatarPreview"></div>
          <div class="avatar-controls">
            <label for="photo">avatar url</label>
            <input type="url" id="photo" name="photo" placeholder="https://example.com/avatar.jpg" />
          </div>
        </div>

        <label for="username">username</label>
        <input type="text" id="username" name="username" required disabled />

        <label for="name">display name</label>
        <input type="text" id="name" name="name" required />

        <label for="email">email</label>
        <input type="email" id="email" name="email" />

        <label for="url">website</label>
        <input type="url" id="url" name="url" placeholder="https://example.com" />

        <i-button id="saveBtn"><button type="submit">save changes</button></i-button>
      </form>
    </i-card>

    <div id="dangerZone" style="display: none;">
      <i-card>
        <h2 class="card-title">danger zone</h2>
        <p style="color: var(--paper-dim); margin-bottom: 1rem; line-height: 1.6; font-size: var(--text-sm);">
          Permanently delete your account and all associated data. This action cannot be undone.
        </p>
        <i-button variant="danger" id="deleteAccountBtn"><button type="button">delete my account</button></i-button>
      </i-card>
    </div>
  </main>

  <i-toast id="toast"></i-toast>

  <script type="module" src="../client/index.ts"></script>
</body>

</html>
