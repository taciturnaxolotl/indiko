<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dashboard • indiko</title>
  <link rel="icon" href="../../public/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mahogany: #26242b;
      --lavender: #d9d0de;
      --old-rose: #bc8da0;
      --rosewood: #a04668;
      --berry-crush: #ab4967;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Space Grotesk", sans-serif;
      background: var(--mahogany);
      color: var(--lavender);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.25rem;
    }

    header {
      width: 100%;
      max-width: 56.25rem;
      margin-bottom: 2rem;
    }

    .profile-preview {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      background: rgba(188, 141, 160, 0.05);
      border: 1px solid var(--old-rose);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--berry-crush);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: var(--lavender);
      text-transform: uppercase;
      flex-shrink: 0;
      border: 3px solid var(--berry-crush);
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--lavender);
      margin-bottom: 0.25rem;
    }

    .profile-username {
      font-size: 1rem;
      color: var(--old-rose);
      margin-bottom: 0.5rem;
    }

    .profile-links {
      display: flex;
      gap: 1rem;
      font-size: 0.875rem;
    }

    .profile-links a {
      color: var(--berry-crush);
      text-decoration: none;
    }

    .profile-links a:hover {
      text-decoration: underline;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--old-rose), var(--berry-crush), var(--rosewood));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.125rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--old-rose);
      font-size: 1rem;
      font-weight: 300;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 56.25rem;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    @media (min-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card {
      background: rgba(188, 141, 160, 0.05);
      border: 1px solid var(--old-rose);
      padding: 1.5rem;
    }

    .card-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--lavender);
      margin-bottom: 1rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      color: var(--old-rose);
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="url"] {
      width: 100%;
      padding: 0.75rem;
      background: rgba(12, 23, 19, 0.6);
      border: 2px solid var(--rosewood);
      color: var(--lavender);
      font-size: 1rem;
      font-family: "Space Grotesk", sans-serif;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--berry-crush);
      background: rgba(12, 23, 19, 0.8);
    }

    .save-btn {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--berry-crush);
      border: 2px solid var(--rosewood);
      color: var(--lavender);
      font-family: "Space Grotesk", sans-serif;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .save-btn:hover:not(:disabled) {
      background: var(--rosewood);
    }

    .save-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      padding: 0.75rem;
      margin-top: 1rem;
      font-size: 0.875rem;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(139, 195, 74, 0.2);
      border: 1px solid #81c784;
      color: #a5d6a7;
    }

    .message.error {
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid #e57373;
      color: #ef9a9a;
    }

    .apps-preview {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .app-item {
      padding: 0.75rem;
      background: rgba(12, 23, 19, 0.6);
      border: 1px solid var(--rosewood);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-name {
      font-weight: 500;
      color: var(--lavender);
    }

    .app-date {
      font-size: 0.875rem;
      color: var(--old-rose);
    }

    .loading, .empty {
      text-align: center;
      padding: 1rem;
      color: var(--old-rose);
      font-size: 0.875rem;
    }

    .view-all {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: var(--berry-crush);
      text-decoration: none;
      font-size: 0.875rem;
    }

    .view-all:hover {
      text-decoration: underline;
    }

    footer {
      width: 100%;
      max-width: 56.25rem;
      padding: 1rem;
      text-align: center;
      color: var(--old-rose);
      font-size: 0.875rem;
      font-weight: 300;
      letter-spacing: 0.05rem;
    }

    footer a {
      color: var(--berry-crush);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--rosewood);
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <header>
    <h1 id="welcome">welcome</h1>
    <p class="subtitle" id="subtitle">loading...</p>
  </header>

  <main>
    <div class="profile-preview">
      <div class="profile-avatar" id="profileAvatar">
        <span id="avatarInitials"></span>
      </div>
      <div class="profile-info">
        <div class="profile-name" id="profileName">Loading...</div>
        <div class="profile-username" id="profileUsername">@username</div>
        <div class="profile-links" id="profileLinks">
          <a href="/u/" id="publicProfileLink">view public profile</a>
        </div>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="card">
        <h2 class="card-title">profile</h2>
        <form id="profileForm">
          <div class="form-group">
            <label for="name">name</label>
            <input type="text" id="name" name="name" required />
          </div>

          <div class="form-group">
            <label for="email">email (optional)</label>
            <input type="email" id="email" name="email" />
          </div>

          <div class="form-group">
            <label for="photo">photo url (optional)</label>
            <input type="url" id="photo" name="photo" placeholder="https://example.com/photo.jpg" />
          </div>

          <div class="form-group">
            <label for="url">website url (optional)</label>
            <input type="url" id="url" name="url" placeholder="https://example.com" />
          </div>

          <button type="submit" class="save-btn" id="saveBtn">save profile</button>
          <div id="message" class="message"></div>
        </form>
      </div>

      <div class="card">
        <h2 class="card-title">recent apps</h2>
        <div id="recentApps" class="apps-preview">
          <div class="loading">loading...</div>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer">
    loading...
  </footer>

  <script type="module" src="../client/index.ts"></script>
</body>

</html>
