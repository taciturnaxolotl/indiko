<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>indiko</title>
  <link rel="icon" href="../../public/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mahogany: #26242b;
      --lavender: #d9d0de;
      --old-rose: #bc8da0;
      --rosewood: #a04668;
      --berry-crush: #ab4967;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Space Grotesk", sans-serif;
      background: var(--mahogany);
      color: var(--lavender);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.25rem;
    }

    header {
      width: 100%;
      max-width: 56.25rem;
      align-self: flex-start;
      margin-left: auto;
      margin-right: auto;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--old-rose), var(--berry-crush), var(--rosewood));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.125rem;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      width: 100%;
      padding-top: 2rem;
    }

    footer {
      width: 100%;
      max-width: 56.25rem;
      padding: 1rem;
      text-align: center;
      color: var(--old-rose);
      font-size: 0.875rem;
      font-weight: 300;
      letter-spacing: 0.05rem;
    }

    footer strong {
      color: var(--lavender);
      font-weight: 500;
    }

    footer a {
      color: var(--berry-crush);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--rosewood);
      text-decoration: underline;
    }

    .users-section {
      width: 100%;
      max-width: 56.25rem;
    }

    .users-section h2 {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--lavender);
      margin-bottom: 1.5rem;
      letter-spacing: -0.05rem;
    }

    .users-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .user-card {
      background: rgba(188, 141, 160, 0.05);
      border: 1px solid var(--old-rose);
      padding: 1.5rem;
      display: flex;
      gap: 1.5rem;
      align-items: center;
      transition: background 0.2s;
    }

    .user-card:hover {
      background: rgba(188, 141, 160, 0.1);
    }

    .user-avatar {
      width: 4rem;
      height: 4rem;
      border-radius: 50%;
      background: var(--berry-crush);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--lavender);
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }

    .user-name {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--lavender);
    }

    .user-meta {
      font-size: 0.875rem;
      color: var(--old-rose);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .user-meta-item {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .user-badges {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .user-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
    }

    .badge-admin {
      background: var(--berry-crush);
      color: var(--lavender);
    }

    .badge-role {
      background: rgba(188, 141, 160, 0.2);
      color: var(--lavender);
      border: 1px solid var(--old-rose);
    }

    .badge-status {
      border: 1px solid var(--old-rose);
    }

    .badge-status.active {
      background: rgba(139, 195, 74, 0.2);
      color: #a5d6a7;
      border-color: #81c784;
    }

    .badge-status.suspended {
      background: rgba(244, 67, 54, 0.2);
      color: #ef9a9a;
      border-color: #e57373;
    }

    .badge-status.inactive {
      background: rgba(158, 158, 158, 0.2);
      color: #bdbdbd;
      border-color: #9e9e9e;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--old-rose);
      font-size: 1rem;
    }

    .error {
      text-align: center;
      padding: 2rem;
      color: var(--rosewood);
      font-size: 1rem;
    }
  </style>
</head>

<body>
  <header>
    <img src="../../public/logo.svg" alt="indiko" style="height: 2rem; margin-bottom: 0.5rem;" />
  </header>

  <main>
    <div class="users-section">
      <h2>users</h2>
      <div id="usersList" class="users-list">
        <div class="loading">loading users...</div>
      </div>
    </div>
  </main>

  <footer id="footer">
    loading...
  </footer>

  <script type="module" src="../client/index.ts"></script>
</body>

</html>
