<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dashboard • indiko</title>
  <meta name="description" content="Your Indiko dashboard - manage your profile, apps, and passkeys" />
  <link rel="icon" href="../../public/favicon.svg" type="image/svg+xml" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Dashboard • Indiko" />
  <meta property="og:description" content="Your Indiko dashboard - manage your profile, apps, and passkeys" />
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Dashboard • Indiko" />
  <meta name="twitter:description" content="Your Indiko dashboard - manage your profile, apps, and passkeys" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    /* Dashboard-specific styles */
    .profile-preview {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      background: rgba(188, 141, 160, 0.05);
      border: 1px solid var(--old-rose);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border: 3px solid var(--berry-crush);
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--lavender);
      margin-bottom: 0.25rem;
    }

    .profile-username {
      font-size: 1rem;
      color: var(--old-rose);
      margin-bottom: 0.5rem;
    }

    .profile-links {
      display: flex;
      gap: 1rem;
      font-size: 0.875rem;
    }

    .profile-links a {
      color: var(--berry-crush);
      text-decoration: none;
    }

    .profile-links a:hover {
      text-decoration: underline;
    }

    h1 {
      margin-bottom: 0.5rem;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    @media (min-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    input[type="text"],
    input[type="email"],
    input[type="url"] {
      padding: 0.75rem;
    }

    .save-btn {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--berry-crush);
      border: 2px solid var(--rosewood);
      color: var(--lavender);
      font-family: "Space Grotesk", sans-serif;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: none;
    }

    .save-btn::before {
      display: none;
    }

    .save-btn:hover:not(:disabled) {
      background: var(--rosewood);
      transform: none;
    }

    .save-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      padding: 0.75rem;
      margin-top: 1rem;
      font-size: 0.875rem;
    }

    .apps-preview {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .app-item {
      padding: 0.75rem;
      background: rgba(12, 23, 19, 0.6);
      border: 1px solid var(--rosewood);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-name {
      font-weight: 500;
      color: var(--lavender);
    }

    .app-date {
      font-size: 0.875rem;
      color: var(--old-rose);
    }

    .view-all {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: var(--berry-crush);
      text-decoration: none;
      font-size: 0.875rem;
    }

    .view-all:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <header>
    <h1 id="welcome">welcome</h1>
    <p class="subtitle" id="subtitle">loading...</p>
  </header>

  <main>
    <div class="profile-preview">
      <div class="profile-avatar" id="profileAvatar">
        <span id="avatarInitials"></span>
      </div>
      <div class="profile-info">
        <div class="profile-name" id="profileName">Loading...</div>
        <div class="profile-username" id="profileUsername">@username</div>
        <div class="profile-links" id="profileLinks">
          <a href="/u/" id="publicProfileLink">view public profile</a>
        </div>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="card">
        <h2 class="card-title">profile</h2>
        <form id="profileForm">
          <div class="form-group">
            <label for="name">name</label>
            <input type="text" id="name" name="name" required />
          </div>

          <div class="form-group">
            <label for="email">email (optional)</label>
            <input type="email" id="email" name="email" />
          </div>

          <div class="form-group">
            <label for="photo">photo url (optional)</label>
            <input type="url" id="photo" name="photo" placeholder="https://example.com/photo.jpg" />
          </div>

          <div class="form-group">
            <label for="url">website url (optional)</label>
            <input type="url" id="url" name="url" placeholder="https://example.com" />
          </div>

          <button type="submit" class="save-btn" id="saveBtn">save profile</button>
          <div id="message" class="message"></div>
        </form>
      </div>

      <div class="card">
        <h2 class="card-title">recent apps</h2>
        <div id="recentApps" class="apps-preview">
          <div class="loading">loading...</div>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer">
    loading...
  </footer>

  <script type="module" src="../client/index.ts"></script>
</body>

</html>
