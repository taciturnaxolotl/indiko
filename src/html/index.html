<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dashboard • indiko</title>
  <meta name="description" content="Your Indiko dashboard - manage your profile, apps, and passkeys" />
  <link rel="icon" href="../../public/favicon.svg" type="image/svg+xml" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Dashboard • Indiko" />
  <meta property="og:description" content="Your Indiko dashboard - manage your profile, apps, and passkeys" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Dashboard • Indiko" />
  <meta name="twitter:description" content="Your Indiko dashboard - manage your profile, apps, and passkeys" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    /* Dashboard-specific styles */
    .profile-section {
      background: rgba(188, 141, 160, 0.05);
      border: 1px solid var(--old-rose);
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--lavender);
      margin-bottom: 1.5rem;
    }

    .avatar-upload {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border: 3px solid var(--berry-crush);
      font-size: 2rem;
    }

    .avatar-controls {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--lavender);
      margin-bottom: 0.25rem;
    }

    .profile-username {
      font-size: 1rem;
      color: var(--old-rose);
      margin-bottom: 0.5rem;
    }

    .profile-links {
      display: flex;
      gap: 1rem;
      font-size: 0.875rem;
    }

    .profile-links a {
      color: var(--berry-crush);
      text-decoration: none;
    }

    .profile-links a:hover {
      text-decoration: underline;
    }

    h1 {
      margin-bottom: 0.5rem;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    @media (min-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    input[type="text"],
    input[type="email"],
    input[type="url"] {
      margin-bottom: 1.5rem;
    }

    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .button-group button {
      flex: 1;
    }

    .message {
      padding: 0.75rem;
      margin-top: 1rem;
      font-size: 0.875rem;
    }

    .apps-preview {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .app-item {
      padding: 0.75rem;
      background: rgba(12, 23, 19, 0.6);
      border: 1px solid var(--rosewood);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-name {
      font-weight: 500;
      color: var(--lavender);
    }

    .app-date {
      font-size: 0.875rem;
      color: var(--old-rose);
    }

    .view-all {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: var(--berry-crush);
      text-decoration: none;
      font-size: 0.875rem;
    }

    .view-all:hover {
      text-decoration: underline;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--mahogany);
      border: 2px solid var(--berry-crush);
      padding: 1rem 1.5rem;
      color: var(--lavender);
      font-size: 0.875rem;
      font-weight: 500;
      z-index: 2000;
      opacity: 0;
      transform: translateY(1rem);
      transition: opacity 0.3s, transform 0.3s;
      max-width: 25rem;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.5);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.error {
      border-color: var(--rosewood);
    }

    .toast.success {
      border-color: var(--berry-crush);
    }
  </style>
</head>

<body>
  <header>
    <h1 id="welcome">welcome</h1>
    <p class="subtitle" id="subtitle">loading...</p>
  </header>

  <main>
    <div class="profile-section">
      <h2 class="section-title">recent apps</h2>
      <div id="recentApps" class="apps-preview">
        <div class="loading">loading...</div>
      </div>
    </div>

    <div class="profile-section">
      <h2 class="section-title">profile settings</h2>

      <form id="profileForm">
        <div class="avatar-upload">
          <div class="profile-avatar" id="avatarPreview">
            <!-- Avatar will be rendered here -->
          </div>
          <div class="avatar-controls">
            <label for="photo">avatar url</label>
            <input type="url" id="photo" name="photo" placeholder="https://example.com/avatar.jpg" />
            <small style="color: var(--old-rose); font-size: 0.75rem;">Enter a URL to an image</small>
          </div>
        </div>

        <label for="username">username</label>
        <input type="text" id="username" name="username" required disabled />

        <label for="name">display name</label>
        <input type="text" id="name" name="name" required />

        <label for="email">email</label>
        <input type="email" id="email" name="email" />

        <label for="url">website</label>
        <input type="url" id="url" name="url" placeholder="https://example.com" />

        <button type="submit" id="saveBtn">save changes</button>
      </form>
    </div>

    <div class="profile-section" id="dangerZone" style="border-color: var(--rosewood); display: none;">
      <h2 class="section-title" style="color: var(--rosewood);">danger zone</h2>
      <p style="color: var(--old-rose); margin-bottom: 1.5rem; line-height: 1.6;">
        Permanently delete your account and all associated data. This action cannot be undone.
      </p>
      <button type="button" id="deleteAccountBtn" style="width: 100%;">
        delete my account
      </button>
    </div>
  </main>

  <footer id="footer">
    loading...
  </footer>

  <div id="toast" class="toast"></div>

  <script type="module" src="../client/index.ts"></script>
</body>

</html>
