<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>profile • indiko</title>
  <meta name="description" content="Edit your Indiko profile information" />
  <link rel="icon" href="../../public/favicon.svg" type="image/svg+xml" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Edit Profile • Indiko" />
  <meta property="og:description" content="Edit your Indiko profile information" />
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Edit Profile • Indiko" />
  <meta name="twitter:description" content="Edit your Indiko profile information" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mahogany: #26242b;
      --lavender: #d9d0de;
      --old-rose: #bc8da0;
      --rosewood: #a04668;
      --berry-crush: #ab4967;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Space Grotesk", sans-serif;
      background: var(--mahogany);
      color: var(--lavender);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.25rem;
    }

    header {
      width: 100%;
      max-width: 56.25rem;
      align-self: flex-start;
      margin-left: auto;
      margin-right: auto;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--old-rose), var(--berry-crush), var(--rosewood));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.125rem;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .profile-container {
      width: 100%;
      max-width: 56.25rem;
    }

    .profile-section {
      background: rgba(188, 141, 160, 0.05);
      border: 1px solid var(--old-rose);
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--lavender);
      margin-bottom: 1.5rem;
    }

    .avatar-upload {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .avatar-preview {
      width: 6rem;
      height: 6rem;
      border-radius: 50%;
      background: var(--berry-crush);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: var(--lavender);
      text-transform: uppercase;
      overflow: hidden;
    }

    .avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-controls {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      display: block;
      color: var(--old-rose);
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="url"] {
      width: 100%;
      padding: 0.875rem 1rem;
      background: rgba(12, 23, 19, 0.6);
      border: 2px solid var(--rosewood);
      border-radius: 0;
      color: var(--lavender);
      font-size: 1rem;
      font-family: "Space Grotesk", sans-serif;
      margin-bottom: 1.5rem;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--berry-crush);
      background: rgba(12, 23, 19, 0.8);
    }

    input::placeholder {
      color: rgba(217, 208, 222, 0.4);
    }

    input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button {
      position: relative;
      padding: 1rem 2rem;
      background: var(--berry-crush);
      color: var(--lavender);
      border: 4px solid var(--mahogany);
      border-radius: 0;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: "Space Grotesk", sans-serif;
      transition: all 0.15s ease;
      text-transform: uppercase;
      letter-spacing: 0.1rem;
      box-shadow: 6px 6px 0 var(--mahogany);
    }

    button::before {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      background: transparent;
      border: 4px solid var(--rosewood);
      pointer-events: none;
      transition: all 0.15s ease;
    }

    button:hover:not(:disabled) {
      transform: translate(3px, 3px);
      box-shadow: 3px 3px 0 var(--mahogany);
    }

    button:hover:not(:disabled)::before {
      top: -7px;
      left: -7px;
      right: -7px;
      bottom: -7px;
    }

    button:active:not(:disabled) {
      transform: translate(6px, 6px);
      box-shadow: 0 0 0 var(--mahogany);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .button-secondary {
      background: transparent;
      color: var(--old-rose);
      box-shadow: 4px 4px 0 var(--mahogany);
    }

    .button-secondary::before {
      border-color: var(--old-rose);
    }

    .button-secondary:hover:not(:disabled) {
      background: rgba(188, 141, 160, 0.1);
    }

    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .message {
      padding: 1rem;
      margin-bottom: 1.5rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(160, 70, 104, 0.2);
      border: 2px solid var(--rosewood);
      color: var(--lavender);
    }

    .message.success {
      background: rgba(188, 141, 160, 0.2);
      border: 2px solid var(--old-rose);
      color: var(--lavender);
    }

    footer {
      width: 100%;
      max-width: 56.25rem;
      padding: 1rem;
      text-align: center;
      color: var(--old-rose);
      font-size: 0.875rem;
      margin-top: 2rem;
    }

    footer a {
      color: var(--berry-crush);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--rosewood);
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <header>
    <img src="../../public/logo.svg" alt="indiko" style="height: 2rem; margin-bottom: 0.5rem;" />
  </header>

  <main>
    <div class="profile-container">
      <div id="message" class="message"></div>

      <div class="profile-section">
        <h2 class="section-title">profile settings</h2>

        <form id="profileForm">
          <div class="avatar-upload">
            <div class="avatar-preview" id="avatarPreview">
              <!-- Avatar will be rendered here -->
            </div>
            <div class="avatar-controls">
              <label for="photo">avatar url</label>
              <input type="url" id="photo" name="photo" placeholder="https://example.com/avatar.jpg" />
              <small style="color: var(--old-rose); font-size: 0.75rem;">Enter a URL to an image</small>
            </div>
          </div>

          <label for="username">username</label>
          <input type="text" id="username" name="username" required disabled />

          <label for="name">display name</label>
          <input type="text" id="name" name="name" required />

          <label for="email">email</label>
          <input type="email" id="email" name="email" />

          <label for="url">website</label>
          <input type="url" id="url" name="url" placeholder="https://example.com" />

          <div class="button-group">
            <button type="submit" id="saveBtn">save changes</button>
            <button type="button" class="button-secondary" onclick="window.location.href='/'">cancel</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <a href="/">← back to dashboard</a>
  </footer>

  <script type="module" src="../client/profile.ts"></script>
</body>

</html>
