<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>profile • indiko</title>
  <meta name="description" content="Edit your Indiko profile information" />
  <link rel="icon" href="../../public/favicon.svg" type="image/svg+xml" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Edit Profile • Indiko" />
  <meta property="og:description" content="Edit your Indiko profile information" />
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Edit Profile • Indiko" />
  <meta name="twitter:description" content="Edit your Indiko profile information" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    /* Profile-specific styles */
    header {
      align-self: flex-start;
      margin-left: auto;
      margin-right: auto;
    }

    main {
      display: flex;
      justify-content: center;
    }

    .profile-container {
      width: 100%;
      max-width: 56.25rem;
    }

    .profile-section {
      background: rgba(188, 141, 160, 0.05);
      border: 1px solid var(--old-rose);
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--lavender);
      margin-bottom: 1.5rem;
    }

    .avatar-upload {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .avatar-preview {
      width: 6rem;
      height: 6rem;
      font-size: 2rem;
    }

    .avatar-controls {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="url"] {
      margin-bottom: 1.5rem;
    }

    footer {
      margin-top: 2rem;
    }
  </style>
</head>

<body>
  <header>
    <img src="../../public/logo.svg" alt="indiko" style="height: 2rem; margin-bottom: 0.5rem;" />
  </header>

  <main>
    <div class="profile-container">
      <div id="message" class="message"></div>

      <div class="profile-section">
        <h2 class="section-title">profile settings</h2>

        <form id="profileForm">
          <div class="avatar-upload">
            <div class="avatar-preview" id="avatarPreview">
              <!-- Avatar will be rendered here -->
            </div>
            <div class="avatar-controls">
              <label for="photo">avatar url</label>
              <input type="url" id="photo" name="photo" placeholder="https://example.com/avatar.jpg" />
              <small style="color: var(--old-rose); font-size: 0.75rem;">Enter a URL to an image</small>
            </div>
          </div>

          <label for="username">username</label>
          <input type="text" id="username" name="username" required disabled />

          <label for="name">display name</label>
          <input type="text" id="name" name="name" required />

          <label for="email">email</label>
          <input type="email" id="email" name="email" />

          <label for="url">website</label>
          <input type="url" id="url" name="url" placeholder="https://example.com" />

          <div class="button-group">
            <button type="submit" id="saveBtn">save changes</button>
            <button type="button" class="button-secondary" onclick="window.location.href='/'">cancel</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <a href="/">← back to dashboard</a>
  </footer>

  <script type="module" src="../client/profile.ts"></script>
</body>

</html>
