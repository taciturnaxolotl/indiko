<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>login • indiko</title>
  <meta name="description" content="Sign in to your Indiko account with passkey authentication" />
  <link rel="icon" href="../../public/favicon.svg" type="image/svg+xml" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Login • Indiko" />
  <meta property="og:description" content="Sign in to your Indiko account with passkey authentication" />
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Login • Indiko" />
  <meta name="twitter:description" content="Sign in to your Indiko account with passkey authentication" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    /* Login-specific styles */
    body {
      justify-content: center;
    }

    main {
      max-width: 28rem !important;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      margin-bottom: 2rem;
    }

    .auth-box {
      background: rgba(188, 141, 160, 0.05);
      border: 1px solid var(--old-rose);
      padding: 2rem;
      margin-bottom: 1rem;
    }

    input[type="text"],
    input[type="password"] {
      margin-bottom: 1rem;
    }

    .ldap-user-display {
      background: rgba(188, 141, 160, 0.1);
      border-left: 3px solid var(--berry-crush);
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      text-align: left;
      font-size: 0.875rem;
    }

    .ldap-user-display .label {
      color: var(--old-rose);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
    }

    .ldap-user-display .username {
      color: var(--lavender);
      font-weight: 600;
    }

    button {
      width: 100%;
      padding: 1.25rem 2rem;
      font-size: 1.125rem;
      margin-bottom: 0.75rem;
    }

    .info {
      margin-top: 1.5rem;
      padding: 1rem;
      background: rgba(188, 141, 160, 0.05);
      border-radius: 0.5rem;
      font-size: 0.8125rem;
      color: var(--old-rose);
      line-height: 1.6;
      text-align: left;
    }

    .info strong {
      color: var(--lavender);
    }
  </style>
</head>

<body>
  <main>
    <img src="../../public/logo.svg" alt="indiko" style="height: 3rem; margin-bottom: 0.5rem;" />
    <p class="subtitle">sign in with passkey</p>

    <div id="message" class="message"></div>

    <div class="auth-box">
      <form id="loginForm">
        <input type="text" id="username" placeholder="username" required autocomplete="username webauthn" />
        <button type="submit" id="loginBtn">sign in</button>
      </form>

      <form id="registerForm" style="display: none;">
        <input type="text" id="registerUsername" placeholder="create username" required
          autocomplete="username webauthn" />
        <button type="submit" class="secondary-btn" id="registerBtn">create passkey</button>
      </form>

      <form id="ldapForm" style="display: none;">
        <div class="ldap-user-display">
          <div class="label">username</div>
          <div class="username" id="ldapUsername"></div>
        </div>
        <input type="password" id="ldapPassword" placeholder="LDAP password" required autocomplete="current-password" />
        <button type="submit" id="ldapBtn">verify & continue</button>
      </form>
    </div>

    <div class="info">
      <strong>What's a passkey?</strong><br>
      A passwordless login using your device's biometrics (fingerprint, face) or security key. More secure than
      passwords, no typing required.
    </div>
  </main>

  <script type="module" src="../client/login.ts"></script>

</body>

</html>
