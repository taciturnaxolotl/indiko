<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>login • indiko</title>
  <link rel="icon" href="../../public/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mahogany: #26242b;
      --lavender: #d9d0de;
      --old-rose: #bc8da0;
      --rosewood: #a04668;
      --berry-crush: #ab4967;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Space Grotesk", sans-serif;
      background: var(--mahogany);
      color: var(--lavender);
      min-height: 100vh;
      padding: 2.5rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    main {
      max-width: 28rem;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--old-rose), var(--berry-crush), var(--rosewood));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.125rem;
    }

    .subtitle {
      color: var(--old-rose);
      margin-bottom: 2rem;
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0.05rem;
    }

    .auth-box {
      background: rgba(188, 141, 160, 0.05);
      border: 1px solid var(--old-rose);
      border-radius: 0;
      padding: 2rem;
      margin-bottom: 1rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.875rem 1rem;
      background: rgba(12, 23, 19, 0.6);
      border: 2px solid var(--rosewood);
      border-radius: 0;
      color: var(--lavender);
      font-size: 1rem;
      font-family: "Space Grotesk", sans-serif;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
      letter-spacing: 0.025rem;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--berry-crush);
      background: rgba(12, 23, 19, 0.8);
    }

    input::placeholder {
      color: rgba(217, 208, 222, 0.4);
    }

    button {
      position: relative;
      width: 100%;
      padding: 1.25rem 2rem;
      background: var(--berry-crush);
      color: var(--lavender);
      border: 4px solid var(--mahogany);
      border-radius: 0;
      font-size: 1.125rem;
      font-weight: 700;
      cursor: pointer;
      font-family: "Space Grotesk", sans-serif;
      transition: all 0.15s ease;
      text-transform: uppercase;
      letter-spacing: 0.1rem;
      margin-bottom: 0.75rem;
      box-shadow: 6px 6px 0 var(--mahogany);
    }

    button::before {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      background: transparent;
      border: 4px solid var(--rosewood);
      pointer-events: none;
      transition: all 0.15s ease;
    }

    button:hover:not(:disabled) {
      transform: translate(3px, 3px);
      box-shadow: 3px 3px 0 var(--mahogany);
    }

    button:hover:not(:disabled)::before {
      top: -7px;
      left: -7px;
      right: -7px;
      bottom: -7px;
    }

    button:active:not(:disabled) {
      transform: translate(6px, 6px);
      box-shadow: 0 0 0 var(--mahogany);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary-btn {
      background: transparent;
      color: var(--old-rose);
      box-shadow: 4px 4px 0 var(--mahogany);
    }

    .secondary-btn::before {
      border-color: var(--old-rose);
    }

    .secondary-btn:hover:not(:disabled) {
      background: rgba(188, 141, 160, 0.1);
    }

    .message {
      margin-bottom: 1rem;
      padding: 0.875rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      letter-spacing: 0.025rem;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(160, 70, 104, 0.2);
      border: 2px solid var(--rosewood);
      color: var(--lavender);
    }

    .message.success {
      background: rgba(188, 141, 160, 0.2);
      border: 2px solid var(--old-rose);
      color: var(--lavender);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: var(--old-rose);
      font-size: 0.875rem;
      font-weight: 300;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(188, 141, 160, 0.3);
    }

    .divider span {
      padding: 0 1rem;
    }

    .info {
      margin-top: 1.5rem;
      padding: 1rem;
      background: rgba(188, 141, 160, 0.05);
      border-radius: 0.5rem;
      font-size: 0.8125rem;
      color: var(--old-rose);
      line-height: 1.6;
      text-align: left;
    }

    .info strong {
      color: var(--lavender);
    }

    a {
      color: var(--berry-crush);
      text-decoration: none;
      transition: color 0.2s;
    }

    a:hover {
      color: var(--rosewood);
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main>
    <img src="../../public/logo.svg" alt="indiko" style="height: 3rem; margin-bottom: 0.5rem;" />
    <p class="subtitle">sign in with passkey</p>

    <div id="message" class="message"></div>

    <div class="auth-box">
      <form id="loginForm">
        <input type="text" id="username" placeholder="username" required autocomplete="username webauthn" />
        <button type="submit" id="loginBtn">sign in</button>
      </form>

      <form id="registerForm" style="display: none;">
        <input type="text" id="registerUsername" placeholder="create username" required
          autocomplete="username webauthn" />
        <button type="submit" class="secondary-btn" id="registerBtn">create passkey</button>
      </form>
    </div>

    <div class="info">
      <strong>What's a passkey?</strong><br>
      A passwordless login using your device's biometrics (fingerprint, face) or security key. More secure than
      passwords, no typing required.
    </div>
  </main>

  <script type="module" src="../client/login.ts"></script>

</body>

</html>
